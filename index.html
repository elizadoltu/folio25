  <script>
    function addSchemaForPage() {
      const pageSchemas = {
        '/': {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Eliza Doltu | Web Developer & Designer",
          "url": "https://elizadoltuofficial.net/",
          "description": "Portfolio of Eliza Doltu, a creative web developer and designer crafting immersive digital experiences.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://elizadoltuofficial.net/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        
        '/projects/:projectLink': {
          "@context": "https://schema.org",
          "@type": "CreativeWork",
          "name": "Project Details | Eliza Doltu",
          "url": "https://elizadoltuofficial.net/projects/{projectLink}",
          "description": "Detailed insights into Eliza Doltu's creative projects, showcasing innovative web design and development."
        }
      };
  
      const path = window.location.pathname;
      let schema = pageSchemas[path] || pageSchemas['/'];
  
      if (path.startsWith('/projects/')) {
        const projectLink = path.split('/projects/')[1];
        schema = {
          ...pageSchemas['/projects/:projectLink'],
          "url": `https://elizadoltuofficial.net/projects/${projectLink}`,
          "name": `${projectLink.replace(/-/g, ' ')} | Eliza Doltu`
        };
      }
  
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(schema);
      document.head.appendChild(script);
    }
  
    window.onload = addSchemaForPage;
  </script>
